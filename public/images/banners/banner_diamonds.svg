<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A1A" />
      <stop offset="40%" stop-color="#1D0E1C" />
      <stop offset="100%" stop-color="#2D0A14" />
    </linearGradient>
    <linearGradient id="cyanDia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0044AA" />
    </linearGradient>
    <linearGradient id="roseDia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B72" />
      <stop offset="50%" stop-color="#FF003C" />
      <stop offset="100%" stop-color="#80001B" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad1)" />

  <!-- Abstract Grid Lines -->
  <g stroke="#FF2E51" stroke-width="1" opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
  </g>

  <!-- Background Energy Orbs -->
  <circle cx="1000" cy="250" r="220" fill="#FF003C" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="850" cy="180" r="140" fill="#00D4FF" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="200" cy="400" r="180" fill="#FF4B72" opacity="0.1" filter="url(#softGlow)" />

  <!-- Left Side Banner Typography -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#FF2E51" fill-opacity="0.18" stroke="#FF2E51" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#00FFB2" />
    <text x="36" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">INSTANT FREE FIRE TOP-UP</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      GET <tspan fill="#FF2E51">DIAMONDS</tspan>
    </text>
    <text x="0" y="160" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      INSTANTLY BY <tspan fill="#00D4FF">PLAYER UID</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="210" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="500">
      ⚡ 100% Anti-Ban Guarantee • Direct In-Game Credit within 60 Seconds
    </text>
    <text x="0" y="240" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">
      🔥 Flash Sale: Extra 15% Bonus Diamonds on select packs today!
    </text>

    <!-- CTA Button Style Graphics -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="210" height="52" rx="14" fill="#FF2E51" filter="url(#glow)" />
      <text x="40" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">TOP UP NOW ➔</text>
    </g>
  </g>

  <!-- Right Side Visual: Giant 3D Diamond Art -->
  <g transform="translate(860, 240)">
    <!-- Cyan Diamond Facets -->
    <polygon points="0,-160 130,-50 0,160 -130,-50" fill="url(#cyanDia)" opacity="0.9" />
    <polygon points="0,-160 0,160 130,-50" fill="#0088EE" opacity="0.6" />
    <polygon points="0,-160 0,160 -130,-50" fill="#00C4FF" opacity="0.5" />
    <polygon points="-70,-50 0,-160 70,-50 0,0" fill="#FFFFFF" opacity="0.35" />
    <polygon points="0,0 70,-50 0,160" fill="#003399" opacity="0.4" />
    <polygon points="0,0 -70,-50 0,160" fill="#0055CC" opacity="0.3" />

    <!-- Small Crimson Accent Diamond -->
    <g transform="translate(140, 80) scale(0.48)">
      <polygon points="0,-160 130,-50 0,160 -130,-50" fill="url(#roseDia)" filter="url(#glow)" />
      <polygon points="0,-160 0,160 130,-50" fill="#88001B" opacity="0.6" />
      <polygon points="-70,-50 0,-160 70,-50 0,0" fill="#FFFFFF" opacity="0.4" />
    </g>

    <!-- Small Cyan Accent Diamond -->
    <g transform="translate(-160, 40) scale(0.35)">
      <polygon points="0,-160 130,-50 0,160 -130,-50" fill="url(#cyanDia)" filter="url(#glow)" />
      <polygon points="-70,-50 0,-160 70,-50 0,0" fill="#FFFFFF" opacity="0.4" />
    </g>

    <!-- Floating Sparkles & Light Orbs -->
    <circle cx="80" cy="-120" r="4" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="-100" cy="-80" r="5" fill="#00FFFF" filter="url(#glow)" />
    <circle cx="120" cy="140" r="3" fill="#FF2E51" filter="url(#glow)" />
    <circle cx="-80" cy="110" r="4" fill="#FFD700" filter="url(#glow)" />
    <circle cx="0" cy="-165" r="8" fill="#FFFFFF" filter="url(#glow)" />
  </g>
</svg>
