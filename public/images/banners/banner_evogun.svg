<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D08" />
      <stop offset="50%" stop-color="#22120C" />
      <stop offset="100%" stop-color="#330E07" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A00" />
      <stop offset="50%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FFDD00" />
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="fg" />
      <feComposite in="SourceGraphic" in2="fg" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bgGrad3)" />

  <circle cx="950" cy="250" r="240" fill="#FF5500" opacity="0.16" filter="url(#fireGlow)" />
  <circle cx="200" cy="180" r="150" fill="#FF1A00" opacity="0.08" filter="url(#fireGlow)" />

  <!-- Abstract Grid Lines -->
  <g stroke="#FF5500" stroke-width="1" opacity="0.06">
    <line x1="0" y1="125" x2="1200" y2="125" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="300" height="38" rx="19" fill="#FF5500" fill-opacity="0.18" stroke="#FF5500" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#FF3300" />
    <text x="36" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">EVO GUNS &amp; ELITE PASS</text>

    <text x="0" y="100" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      UPGRADE YOUR <tspan fill="#FF7700">FIREPOWER</tspan>
    </text>
    <text x="0" y="160" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      WITH <tspan fill="#FFDD00">EVO TOKENS</tspan>
    </text>

    <text x="0" y="210" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="500">
      🔥 AK47 Blue Flame Draco, MP40 Cobra &amp; SCAR Megalodon Tokens
    </text>
    <text x="0" y="240" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">
      ⚡ Unlock Special Kill Effects, Hit Sparks &amp; Exclusive Emotes
    </text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="220" height="52" rx="14" fill="#FF5500" filter="url(#fireGlow)" />
      <text x="35" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">UNLOCK NOW ➔</text>
    </g>
  </g>

  <!-- Right Visual: Fiery Evo Emblem & Shield -->
  <g transform="translate(900, 250)">
    <!-- Dragon Flame Wings -->
    <path d="M0,-120 C80,-80 150,20 120,120 C60,160 0,110 0,60 C0,110 -60,160 -120,120 C-150,20 -80,-80 0,-120 Z" fill="url(#fireGrad)" filter="url(#fireGlow)" opacity="0.85" />
    <!-- Inner Core -->
    <polygon points="0,-80 50,-10 30,70 0,40 -30,70 -50,-10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="0" cy="0" r="16" fill="#FF1A00" />
    <circle cx="0" cy="0" r="8" fill="#FFDD00" />

    <!-- Sparkles -->
    <circle cx="70" cy="-60" r="5" fill="#FFDD00" filter="url(#fireGlow)" />
    <circle cx="-80" cy="-40" r="4" fill="#FF7700" filter="url(#fireGlow)" />
    <circle cx="90" cy="60" r="6" fill="#FF1A00" filter="url(#fireGlow)" />
    <circle cx="-60" cy="80" r="4" fill="#FFDD00" filter="url(#fireGlow)" />
  </g>
</svg>
