<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1624" />
      <stop offset="45%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#1B1229" />
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#C77700" />
    </linearGradient>
    <linearGradient id="emeraldPass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFAA" />
      <stop offset="100%" stop-color="#008855" />
    </linearGradient>
    <filter id="goldGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="b1" />
      <feComposite in="SourceGraphic" in2="b1" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bgGrad2)" />

  <!-- Background Glow & Beams -->
  <circle cx="950" cy="240" r="260" fill="#FFB300" opacity="0.12" filter="url(#goldGlow2)" />
  <circle cx="250" cy="150" r="160" fill="#00FFAA" opacity="0.08" filter="url(#goldGlow2)" />

  <!-- Abstract Tech Grid Lines -->
  <g stroke="#FFB300" stroke-width="1" opacity="0.06">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="290" height="38" rx="19" fill="#FFB300" fill-opacity="0.18" stroke="#FFB300" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#FFD700" />
    <text x="36" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">VIP MEMBERSHIP PASS</text>

    <text x="0" y="100" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      WEEKLY &amp; <tspan fill="#FFB300">MONTHLY</tspan>
    </text>
    <text x="0" y="160" fill="#FFFFFF" font-family="'Rajdhani', sans-serif" font-size="62" font-weight="900" letter-spacing="1.5">
      MEMBERSHIP <tspan fill="#00FFAA">SAVINGS</tspan>
    </text>

    <text x="0" y="210" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="500">
      👑 Get 450 to 2,600 Free Fire Diamonds + Daily Rewards &amp; Discount Badges
    </text>
    <text x="0" y="240" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">
      ⚡ Up to 70% Cheaper than Direct Diamond Top-Up
    </text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="230" height="52" rx="14" fill="#FFB300" filter="url(#goldGlow2)" />
      <text x="35" y="32" fill="#0A0D14" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">CLAIM VIP PASS ➔</text>
    </g>
  </g>

  <!-- Right Visual: VIP Golden Crown Card & Shield -->
  <g transform="translate(900, 250)">
    <!-- Card Frame -->
    <rect x="-160" y="-130" width="320" height="260" rx="28" fill="#111B2C" stroke="#FFB300" stroke-width="2.5" opacity="0.9" />
    <rect x="-140" y="-110" width="280" height="220" rx="20" fill="url(#bgGrad2)" stroke="#FFB300" stroke-width="1" opacity="0.6" />

    <!-- Golden Crown Graphics -->
    <path d="M-80,40 L-100,-40 L-40,0 L0,-70 L40,0 L100,-40 L80,40 Z" fill="url(#goldCrown)" filter="url(#goldGlow2)" />
    <circle cx="0" cy="-70" r="10" fill="#FFFFFF" />
    <circle cx="-100" cy="-40" r="7" fill="#00FFAA" />
    <circle cx="100" cy="-40" r="7" fill="#00FFAA" />
    <circle cx="-40" cy="0" r="6" fill="#FF4B72" />
    <circle cx="40" cy="0" r="6" fill="#FF4B72" />

    <!-- VIP Banner Badge -->
    <rect x="-70" y="60" width="140" height="32" rx="16" fill="#FFB300" />
    <text x="-48" y="82" fill="#0A0D14" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="900" letter-spacing="2">VIP ACTIVE</text>
  </g>
</svg>
